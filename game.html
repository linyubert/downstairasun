<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>阿順下樓梯 — AH-SHUN STAIR RUSH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700;800&family=Noto+Sans+TC:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#5c94fc;--line:#bb672d;--text:#382718;--muted:#7a5a3a;
  --yellow:#ffd52a;--yellow-dark:#c99412;--green:#2eaa57;--green-dark:#176d36;
  --blue:#3b74d9;--red:#dc4740;--cream:#fff8dc;--sand:#f4d29c;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1b120c;color:var(--text);
  font-family:Fredoka,"Noto Sans TC",system-ui,sans-serif}
body{display:grid;place-items:center}
#wrap{position:relative;width:min(96vw,420px);height:min(96vh,630px);aspect-ratio:2/3;border-radius:18px;
  overflow:hidden;background:var(--sky);isolation:isolate;
  box-shadow:0 18px 0 #2a1208,0 30px 70px rgba(0,0,0,.52),inset 0 0 0 6px #f4d29c,inset 0 0 0 10px #bb672d}
#wrap:before{content:"";position:absolute;inset:10px;z-index:3;pointer-events:none;border-radius:10px;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.25);background:radial-gradient(circle at 50% 0,rgba(255,255,255,.16),transparent 42%)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.ui{position:absolute;inset:0;z-index:8;pointer-events:none}
.panel,.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20px;pointer-events:auto;background:linear-gradient(180deg,rgba(92,148,252,.18),rgba(20,40,90,.58))}
.card{width:100%;max-width:340px;border:4px solid #78371a;background:linear-gradient(180deg,#fff8dc,#f4d29c);
  border-radius:16px;padding:18px 16px;box-shadow:0 8px 0 #59250f,inset 0 3px 0 #fff}
.brand{font-family:"Press Start 2P",monospace;font-size:8px;letter-spacing:.06em;line-height:1.7;color:var(--green-dark);margin-bottom:8px}
h1{margin:0 0 8px;font-family:"Press Start 2P",monospace;font-size:19px;line-height:1.2;font-weight:400;color:var(--green);
  text-shadow:3px 3px 0 #fff,-1px -1px 0 #175627,3px 3px 0 var(--yellow)}
h1.zh{font-family:"Noto Sans TC",sans-serif;font-weight:900;font-size:26px;letter-spacing:.06em}
.dim{color:var(--muted);font-size:12px}.ok{color:var(--green-dark);font-weight:800}.err{color:var(--red);font-weight:800}
.hidden{display:none!important}
.btn{width:100%;border:0;border-radius:999px;padding:11px 14px;margin-top:8px;font:800 15px Fredoka,"Noto Sans TC",sans-serif;
  color:#39300c;background:var(--yellow);cursor:pointer;box-shadow:0 5px 0 var(--yellow-dark);
  transition:.12s transform,.12s box-shadow,.12s filter}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--yellow-dark)}
.btn.green{color:#fff;background:var(--green);box-shadow:0 5px 0 var(--green-dark)}
.btn.green:active{box-shadow:0 1px 0 var(--green-dark)}
.btn.blue{color:#fff;background:var(--blue);box-shadow:0 5px 0 #1c438f}
.btn.blue:active{box-shadow:0 1px 0 #1c438f}
.btn:disabled{opacity:.38;cursor:not-allowed;transform:none}
.row{display:flex;gap:8px;width:100%}
.slot{flex:1;padding:10px;border-radius:12px;border:3px solid var(--line);background:#fff1c4}
.slot.set{border-color:var(--green);background:#d8f5c8}
.slot .name{font-weight:800;font-size:13px;margin-top:4px}
.slot small{color:var(--muted);font-size:10px;letter-spacing:.08em;font-weight:800}
.meter{position:relative;width:100%;height:14px;border:2px solid #59250f;border-radius:999px;background:#7a3318;overflow:hidden;margin:10px 0}
.meter:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:#fff}
#needle{position:absolute;z-index:2;top:-3px;width:6px;height:18px;border-radius:3px;background:var(--yellow);box-shadow:0 0 0 2px #fff;transition:left .08s linear}
#volBar{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green),var(--yellow));transition:width .08s linear}
#micChip{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:999px;
  border:3px solid var(--line);background:#fff;color:var(--muted);font-size:12px;font-weight:700}
#micChip:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line)}
#micChip.live{color:var(--green-dark);border-color:var(--green)}
#micChip.live:before{background:var(--green);box-shadow:0 0 8px var(--green)}
#bigNote{margin:6px 0 0;font-family:"Press Start 2P",monospace;font-size:22px;line-height:1.4;text-align:center;color:var(--green-dark)}
#bigFreq{text-align:center;color:var(--muted);font-size:12px}
.manual{width:100%;padding:10px;border:3px solid var(--line);border-radius:14px;background:#fff8e4;margin-top:10px}
.targets{display:flex;gap:8px;margin-bottom:8px}
.target{flex:1;padding:7px;text-align:center;border-radius:10px;border:2px solid transparent;background:#f4d29c;color:var(--muted);cursor:pointer;font-size:12px;font-weight:800}
.target.active{color:#fff;background:var(--green);border-color:var(--green-dark)}
#pianoWrap{overflow:auto;width:100%;padding-bottom:2px}
#pianoWrap svg{display:block;margin:auto}
input[type=range]{width:100%;accent-color:var(--green)}
.sens-row{display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px;border:2px dashed var(--line);border-radius:10px;background:#fff8e4}
.sens-row label{font:700 12px Fredoka,"Noto Sans TC",sans-serif;color:var(--green-dark);white-space:nowrap}
.statbig{font-family:"Press Start 2P",monospace;font-size:30px;line-height:1.3;color:var(--green-dark)}
.statbig span:nth-child(2){font-size:12px!important;color:var(--muted)}
.newbest{display:inline-block;margin-left:8px;padding:5px 8px;border-radius:8px;background:var(--yellow);color:#57380c;font:800 9px Fredoka,sans-serif;letter-spacing:.06em}
.toast{position:absolute;z-index:20;left:14px;right:14px;bottom:14px;padding:9px 12px;border:3px solid #78371a;border-radius:12px;
  background:#fff8dc;color:var(--text);text-align:center;font-size:13px;font-weight:700;box-shadow:0 5px 0 #59250f}
.corner{position:absolute;z-index:9;pointer-events:auto;top:14px;display:flex;gap:6px}
.corner.l{left:14px}.corner.r{right:14px}
.cbtn{display:inline-flex;align-items:center;gap:5px;text-decoration:none;padding:6px 10px;border:3px solid #78371a;border-radius:999px;
  background:#fff8dc;color:#78371a;font:800 11px Fredoka,"Noto Sans TC",sans-serif;box-shadow:0 4px 0 #59250f;cursor:pointer;transition:.12s}
.cbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #59250f}
.cbtn.on{background:var(--green);color:#fff;border-color:var(--green-dark)}
#calib{overflow:auto;justify-content:flex-start;padding-top:16px;padding-bottom:16px}
#calib .card{margin:auto 0}
@media(max-height:660px){.card{padding:14px}h1{font-size:17px}h1.zh{font-size:23px}}
</style>
</head>
<body>
<div id="wrap">
<canvas id="cv" width="400" height="600"></canvas>

<div class="ui">
  <div class="corner l"><a class="cbtn" id="btnHome" href="index.html">◄ 主頁</a></div>
  <div class="corner r">
    <button class="cbtn" id="btnMic" title="直笛聲控開關">🎤 聲控：關</button>
    <button class="cbtn" id="btnMute" title="音效開關">🔊</button>
  </div>

  <!-- 直笛聲音控制 -->
  <div id="calib" class="panel hidden">
    <div class="card">
      <div class="brand">♪ STAIR RUSH / MIC SETUP</div>
      <h1 class="zh">直笛聲控設定</h1>
      <div class="dim" style="margin-bottom:10px">吹兩個音就能左右移動，沒有直笛也可以用鍵盤或觸控。</div>
      <div id="micChip"><span id="micTxt">等待麥克風</span></div>
      <div id="bigNote">♪</div>
      <div id="bigFreq">吹一個音試試看</div>
      <div class="meter"><div id="volBar"></div><div id="needle" style="left:50%"></div></div>
      <div class="dim" style="margin-bottom:10px">即時音準 / Pitch monitor</div>
      <div class="row">
        <div id="slotL" class="slot"><small>LEFT NOTE</small><div class="name" id="nmL">尚未設定</div><button class="btn green" id="recL">錄左音</button></div>
        <div id="slotR" class="slot"><small>RIGHT NOTE</small><div class="name" id="nmR">尚未設定</div><button class="btn green" id="recR">錄右音</button></div>
      </div>
      <div id="calibMsg" class="dim" style="min-height:20px;margin-top:10px">建議使用音高穩定、容易辨識的兩個音。</div>
      <div class="sens-row">
        <label for="sens">🎤 收音靈敏度</label>
        <input id="sens" type="range" min="0.3" max="3.0" step="0.1" value="1.0">
        <span id="sensVal" style="font:800 11px 'Press Start 2P',monospace;color:#c99412">1.0×</span>
      </div>
      <div class="manual">
        <button class="btn blue" id="btnManualToggle">🎹 手動選音（不吹也可以）</button>
        <div id="manualPanel" class="hidden" style="margin-top:10px">
          <div class="targets"><div id="tgtL" class="target active">設定 LEFT</div><div id="tgtR" class="target">設定 RIGHT</div></div>
          <div id="pianoWrap"></div>
        </div>
      </div>
      <button class="btn" id="btnPreset">套用直笛預設（升Fa／升Do）</button>
      <div class="row">
        <button class="btn green" id="btnGo">開始下樓</button>
        <button class="btn blue" id="btnBack">回主頁</button>
      </div>
    </div>
  </div>

  <!-- 結束畫面 -->
  <div id="over" class="overlay hidden">
    <div class="card" style="text-align:center">
      <div class="brand">RUN COMPLETE</div>
      <h1 class="zh" id="overTitle" style="color:#dc4740;font-size:22px">遊戲結束</h1>
      <div class="statbig"><span id="overFloors">0</span><span> 樓</span><span class="newbest hidden" id="nbBadge">NEW BEST!</span></div>
      <div class="dim" style="margin:8px 0 14px">最高紀錄：<b id="overBest" style="color:#247a40">0</b> 樓 ・ 最快速度 <b id="overSpd">0</b></div>
      <button class="btn" id="btnRetry">再下一趟</button>
      <button class="btn green" id="btnReCalib">重新設定音符</button>
      <a class="btn blue" id="btnMenu" href="index.html" style="text-decoration:none;display:block;line-height:19px">回主頁面</a>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
</div>
</div>

<script>
"use strict";
/* ===== 阿順下樓梯 — 以 模型3.html（VOICE TOWER）為基礎改版：楼梯主題、角色、安全儲存 ===== */
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}
};
const K_BEST="ahshun.best", K_RUNS="ahshun.runs", K_CFG="ahshun.cfg", K_MUTE="ahshun.mute";

/* ---------- 音高偵測 ---------- */
const NOTE_NAMES=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const ZH={C:"Do","C#":"升Do",D:"Re","D#":"升Re",E:"Mi",F:"Fa","F#":"升Fa",G:"Sol","G#":"升Sol",A:"La","A#":"升La",B:"Si"};
const freqToMidi=f=>69+12*Math.log2(f/440);
const midiToFreq=m=>440*Math.pow(2,(m-69)/12);
function midiName(m){const r=Math.round(m),n=NOTE_NAMES[((r%12)+12)%12],oct=Math.floor(r/12)-1;return `${n.replace("#","♯")}${oct}（${ZH[n]}）`;}
function midiNameShort(m){const r=Math.round(m),n=NOTE_NAMES[((r%12)+12)%12],oct=Math.floor(r/12)-1;return n.replace("#","♯")+oct;}

function autoCorrelate(buf,sampleRate,sensitivity=1.0){
  const SIZE=buf.length; let rms=0;
  for(let i=0;i<SIZE;i++) rms+=buf[i]*buf[i];
  rms=Math.sqrt(rms/SIZE);
  const threshold=.2/sensitivity;
  if(rms<.012/sensitivity) return {freq:-1,rms};
  let r1=0,r2=SIZE-1;
  for(let i=0;i<SIZE/2;i++) if(Math.abs(buf[i])<threshold){r1=i;break;}
  for(let i=1;i<SIZE/2;i++) if(Math.abs(buf[SIZE-i])<threshold){r2=SIZE-i;break;}
  const seg=buf.slice(r1,r2); const N=seg.length;
  if(N<32) return {freq:-1,rms};
  const c=new Float32Array(N);
  for(let i=0;i<N;i++){let s=0;for(let j=0;j<N-i;j++) s+=seg[j]*seg[j+i]; c[i]=s;}
  let d=0; while(d<N-1&&c[d]>c[d+1]) d++;
  let maxVal=-1,maxPos=-1;
  for(let i=d;i<N;i++){if(c[i]>maxVal){maxVal=c[i];maxPos=i;}}
  if(maxPos<=0||c[0]<=0) return {freq:-1,rms};
  if(maxVal/c[0]<(.45/sensitivity)) return {freq:-1,rms};
  let T0=maxPos;
  const x1=c[T0-1],x2=c[T0],x3=c[T0+1],a=(x1+x3-2*x2)/2,b=(x3-x1)/2;
  if(a) T0=T0-b/(2*a);
  return {freq:sampleRate/T0,rms};
}

let actx=null,analyser=null,tbuf=null,micOn=false,micWanted=false;
async function startMic(){
  try{
    actx=actx||new(window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended") await actx.resume();
    if(!micOn){
      const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
      const src=actx.createMediaStreamSource(stream);
      analyser=actx.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=0;
      src.connect(analyser);tbuf=new Float32Array(analyser.fftSize);micOn=true;
    }
    micChip.classList.add("live");micTxt.textContent="麥克風收音中";
    btnMic.textContent="🎤 聲控：開";btnMic.classList.add("on");
    return true;
  }catch(e){
    micTxt.textContent="麥克風無法使用";
    btnMic.textContent="🎤 聲控：關";btnMic.classList.remove("on");
    toast("無法開啟麥克風，請改用鍵盤 ← → 或下方按鈕遊玩");
    return false;
  }
}
function readPitch(s=1.0){
  if(!micOn||!analyser) return {freq:-1,rms:0};
  if(analyser.getFloatTimeDomainData) analyser.getFloatTimeDomainData(tbuf);
  else{const b=new Uint8Array(analyser.fftSize);analyser.getByteTimeDomainData(b);for(let i=0;i<b.length;i++) tbuf[i]=(b[i]-128)/128;}
  return autoCorrelate(tbuf,actx.sampleRate,s);
}

/* ---------- 音效 ---------- */
let muted=store.get(K_MUTE,"0")==="1";
function beep(f,d,type="square",vol=.05,w=0){
  if(muted) return;
  try{
    actx=actx||new(window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended") actx.resume();
    const t=actx.currentTime+w,o=actx.createOscillator(),g=actx.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.02);
  }catch(e){}
}
const sfx={
  land(){beep(330,.05,"square",.05);beep(523,.06,"square",.04,.04);},
  hurt(){beep(196,.18,"square",.08);beep(130,.22,"square",.07,.05);},
  set(){beep(988,.08,"square",.06);beep(1318,.12,"square",.05,.08);},
  count(f){beep(f,.1,"square",.06);},
  milestone(){[659,784,988,1318].forEach((f,i)=>beep(f,.1,"square",.05,i*.08));},
  over(){[392,330,262,196].forEach((f,i)=>beep(f,.2,"square",.07,i*.14));}
};

/* ---------- 設定 ---------- */
const DEF={leftMidi:null,rightMidi:null,tol:70,sens:1.0};
let cfg=Object.assign({},DEF);
try{const s=JSON.parse(store.get(K_CFG,"null"));if(s) cfg=Object.assign(cfg,s);}catch(e){}
function saveCfg(){store.set(K_CFG,JSON.stringify(cfg));}
let best=+store.get(K_BEST,0)||0;

/* ---------- 角色 ---------- */
const CHARS={
  shun:{id:"shun",zh:"阿順",tag:"班級跑腿王",run:255,hp:100,dmg:20,hair:"bob",glasses:true,
    shirt:"#ffd52a",shirtDark:"#e0a90f",collar:"#2eaa57",shorts:"#2eaa57",shortsDark:"#176d36",
    skin:"#f2c294",hairC:"#241d19",rose:"#dc4740",roseDark:"#9c2a24"},
  qing:{id:"qing",zh:"阿青",tag:"飛快但易摔",run:300,hp:85,dmg:22,hair:"short",glasses:false,
    shirt:"#3b74d9",shirtDark:"#25529e",collar:"#ffd52a",shorts:"#f8faf5",shortsDark:"#b9c6d6",
    skin:"#efb987",hairC:"#1f1b18",rose:"#ffd52a",roseDark:"#c99412"},
  mei:{id:"mei",zh:"小美",tag:"穩穩踩好每一步",run:232,hp:128,dmg:12,hair:"twin",glasses:true,
    shirt:"#ff8fc0",shirtDark:"#d84f8b",collar:"#fff",shorts:"#8e5cf0",shortsDark:"#5b34ab",
    skin:"#f6cfae",hairC:"#3a221c",rose:"#2eaa57",roseDark:"#176d36"}
};
const qs=new URLSearchParams(location.search);
const CH=CHARS[qs.get("c")]||CHARS.shun;

/* ---------- DOM ---------- */
const $=id=>document.getElementById(id);
const cv=$("cv"),ctx=cv.getContext("2d");
const calib=$("calib"),over=$("over"),toastEl=$("toast");
const bigNote=$("bigNote"),bigFreq=$("bigFreq"),needle=$("needle"),volBar=$("volBar");
const micChip=$("micChip"),micTxt=$("micTxt");
const btnMic=$("btnMic"),btnMute=$("btnMute");
let toastTimer=null;
function toast(t,ms=2600){toastEl.textContent=t;toastEl.classList.remove("hidden");clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.add("hidden"),ms);}
function show(el){el.classList.remove("hidden")}
function hide(el){el.classList.add("hidden")}

const W=400,H=600,WALL=28,CEIL=30;
function fitCanvas(){const dpr=Math.min(window.devicePixelRatio||1,2);cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
fitCanvas();addEventListener("resize",fitCanvas);
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

const G={state:"count",t:0,speed:56,floors:0,hp:100,maxHp:100,player:null,plats:[],parts:[],floats:[],
  invuln:0,redFlash:0,shake:0,countT:0,countStep:0,inputDir:0,animT:0,bgOff:0,pitchDir:0,keyDir:0,touchDir:0,
  dispMidi:null,maxSpeed:0};
const GRAV=1700,MAXFALL=640;

function newPlayer(){return{x:W/2-15,y:360,w:30,h:48,vx:0,vy:0,on:null,face:1};}
function resetWorld(){
  G.t=0;G.speed=56;G.floors=0;G.maxHp=CH.hp;G.hp=CH.hp;G.player=newPlayer();G.plats=[];G.parts=[];G.floats=[];
  G.invuln=0;G.redFlash=0;G.shake=0;G.maxSpeed=0;
  G.plats.push({x:W/2-70,y:G.player.y+G.player.h,w:140,h:16,type:"normal",dir:0,breaking:-1});
  let y=G.player.y+G.player.h;
  while(y<H+80){y+=randGap();spawnPlat(y);}
}
function randGap(){return 62+Math.random()*36+Math.min(G.floors*.12,26);}
function spawnPlat(y){
  const w=72+Math.random()*36;
  const x=WALL+6+Math.random()*(W-WALL*2-12-w);
  const done=G.floors,r=Math.random();
  const pBalloon=Math.min(.045+done*.0028,.20),pEsc=Math.min(.04+done*.0022,.16),pCrumb=done>10?Math.min(.02+done*.0014,.12):0;
  let type="normal";
  if(r<pBalloon) type="spike"; else if(r<pBalloon+pEsc) type="conv"; else if(r<pBalloon+pEsc+pCrumb) type="crumble";
  const p={x,y,w,h:15,type,dir:0,breaking:-1};
  if(type==="conv") p.dir=Math.random()<.5?-1:1;
  G.plats.push(p);
}

/* ---------- 輸入 ---------- */
const keys={};
addEventListener("keydown",e=>{
  keys[e.key]=true;
  if(e.key==="ArrowLeft"||e.key==="ArrowRight") e.preventDefault();
  if(e.key==="p"||e.key==="P"||e.key==="Escape"){
    if(G.state==="play") G.state="pause"; else if(G.state==="pause") G.state="play";
  }
  if((e.key===" "||e.key==="Enter")&&G.state==="over") startGame();
});
addEventListener("keyup",e=>keys[e.key]=false);
addEventListener("blur",()=>{if(G.state==="play") G.state="pause";});

const PD={cand:0,streak:0,dir:0,miss:0};
function decidePitch(midi,dt){
  let cand=0;
  if(midi!=null&&cfg.leftMidi!=null&&cfg.rightMidi!=null){
    const dL=Math.abs(midi-cfg.leftMidi)*100,dR=Math.abs(midi-cfg.rightMidi)*100;
    if(dR<dL){if(dR<=cfg.tol) cand=1;} else {if(dL<=cfg.tol) cand=-1;}
  }
  if(cand!==0){
    PD.miss=0;
    if(cand===PD.cand) PD.streak++; else {PD.cand=cand;PD.streak=1;}
    if(PD.streak>=2||PD.dir===cand) PD.dir=cand;
  }else{
    PD.cand=0;PD.streak=0;PD.miss+=dt;
    if(PD.miss>.14) PD.dir=0;
  }
  return PD.dir;
}
function currentDir(){
  const k=(keys.ArrowLeft||keys.a||keys.A?-1:0)+(keys.ArrowRight||keys.d||keys.D?1:0);
  G.keyDir=Math.max(-1,Math.min(1,k));
  if(G.pitchDir) return G.pitchDir;
  if(G.keyDir) return G.keyDir;
  return G.touchDir;
}

/* ---------- 遊玩事件 ---------- */
function dust(x,y){for(let i=0;i<4;i++) G.parts.push({x:x+(Math.random()-.5)*16,y,vx:(Math.random()-.5)*60,vy:-20-Math.random()*40,life:.35,color:"rgba(255,230,160,.9)",r:1.5+Math.random()*2});}
function breakPlat(pl){
  pl.gone=true; if(G.player.on===pl) G.player.on=null;
  for(let i=0;i<8;i++) G.parts.push({x:pl.x+Math.random()*pl.w,y:pl.y+4,vx:(Math.random()-.5)*120,vy:-40-Math.random()*80,life:.6,color:"#c9b490",r:2+Math.random()*3});
}
function hurtPlayer(dmg){
  G.hp-=dmg;G.invuln=1.15;G.redFlash=.45;G.shake=.3;sfx.hurt();
  const p=G.player;
  for(let i=0;i<7;i++) G.parts.push({x:p.x+p.w/2,y:p.y+10,vx:(Math.random()-.5)*160,vy:-60-Math.random()*120,life:.5,color:"#dc4740",r:2+Math.random()*2.5});
}
function pushRun(floors){
  let runs=[];try{runs=JSON.parse(store.get(K_RUNS,"[]"))||[];}catch(e){}
  if(!Array.isArray(runs)) runs=[];
  runs.unshift({f:floors,c:CH.id,t:Date.now()});
  store.set(K_RUNS,JSON.stringify(runs.slice(0,20)));
}
function gameOver(reason){
  if(G.state!=="play") return;
  G.state="over";sfx.over();
  const isBest=G.floors>best;
  if(isBest){best=G.floors;store.set(K_BEST,best);}
  pushRun(G.floors);
  $("overTitle").textContent=reason;
  $("overFloors").textContent=G.floors;
  $("overBest").textContent=best;
  $("overSpd").textContent=Math.round(G.maxSpeed);
  $("nbBadge").classList.toggle("hidden",!isBest);
  show(over);
}

/* ---------- 更新 ---------- */
function update(dt){
  const p=G.player;G.t+=dt;
  G.speed=56+Math.min(G.floors*1.05,120);G.maxSpeed=Math.max(G.maxSpeed,G.speed);
  const dy=G.speed*dt;G.bgOff=(G.bgOff+dy*.35)%48;
  if(G.invuln>0) G.invuln-=dt;
  if(G.redFlash>0) G.redFlash-=dt;
  if(G.shake>0) G.shake-=dt;

  for(const f of G.floats){f.y-=28*dt;f.life-=dt;}
  G.floats=G.floats.filter(f=>f.life>0);
  for(const q of G.parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=(q.note?20:900)*dt;q.life-=dt;}
  G.parts=G.parts.filter(q=>q.life>0);

  if(G.pitchDir!==0&&Math.random()<dt*8){
    G.parts.push({x:p.x+p.w/2+p.face*17,y:p.y+11,vx:p.face*(25+Math.random()*20),vy:-48-Math.random()*45,life:.9,
      color:Math.random()<.5?"#ffd52a":"#fff7c0",note:true,glyph:Math.random()<.5?"♪":"♫"});
  }

  const oldBottom=p.y+p.h;
  for(const pl of G.plats) pl.y-=dy;

  if(p.on){
    if(p.on.gone||p.x+p.w<p.on.x+2||p.x>p.on.x+p.on.w-2) p.on=null;
    else{
      p.y=p.on.y-p.h;p.vy=0;
      if(p.on.type==="conv") p.x+=p.on.dir*72*dt;
      if(p.on.type==="crumble"){
        if(p.on.breaking<0) p.on.breaking=.26;
        else{p.on.breaking-=dt;if(p.on.breaking<=0) breakPlat(p.on);}
      }
      if(p.on&&p.on.type==="spike"&&G.invuln<=0) hurtPlayer(CH.dmg);
    }
  }

  const dir=currentDir();G.inputDir=dir;
  if(dir!==0){p.face=dir;G.animT+=dt;}
  const targetVX=dir*CH.run;
  p.vx+=(targetVX-p.vx)*Math.min(1,dt*14);p.x+=p.vx*dt;
  p.x=Math.max(WALL,Math.min(W-WALL-p.w,p.x));

  if(!p.on){
    p.vy=Math.min(p.vy+GRAV*dt,MAXFALL);p.y+=p.vy*dt;
    const bottom=p.y+p.h;
    if(p.vy>0){
      for(const pl of G.plats){
        if(pl.gone) continue;
        if(p.x+p.w<pl.x+4||p.x>pl.x+pl.w-4) continue;
        const oldTop=pl.y+dy;
        if(oldBottom<=oldTop+1&&bottom>=pl.y){
          p.y=pl.y-p.h;p.vy=0;p.on=pl;dust(p.x+p.w/2,pl.y);sfx.land();
          if(pl.type==="spike"&&G.invuln<=0) hurtPlayer(CH.dmg);
          break;
        }
      }
    }
  }

  let maxY=0;for(const pl of G.plats) maxY=Math.max(maxY,pl.y);
  while(maxY<H+80){maxY+=randGap();spawnPlat(maxY);}
  const before=G.plats.length;
  G.plats=G.plats.filter(pl=>{if(pl.gone) return false;if(pl.y+pl.h<-6){pl.gone=true;return false;}return true;});
  const passed=before-G.plats.length;
  if(passed>0){
    const nf=G.floors+passed;
    for(let f=G.floors+1;f<=nf;f++){
      if(f%25===0){G.floats.push({x:W/2,y:H/2-40,text:`-${f} 樓！`,life:1.6,big:true});sfx.milestone();}
    }
    G.floors=nf;
  }

  if(p.y<CEIL){p.y=CEIL;G.hp-=26*dt;G.redFlash=Math.max(G.redFlash,.12);}
  if(p.y>H+30) gameOver("掉出樓梯間！");
  else if(G.hp<=0){G.hp=0;gameOver("體力歸零，阿順退場！");}
}

/* ---------- 繪製 ---------- */
function drawCloud(x,y,s){ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(x,y,10*s,0,Math.PI*2);ctx.arc(x+12*s,y-4*s,12*s,0,Math.PI*2);ctx.arc(x+26*s,y,10*s,0,Math.PI*2);ctx.arc(x+12*s,y+4*s,10*s,0,Math.PI*2);ctx.fill();}

function drawPlat(pl){
  const {x,y,w,h,type}=pl;ctx.save();
  if(pl.breaking>0) ctx.translate(0,(Math.random()-.5)*3);
  if(type==="normal"||type==="crumble"){
    // 踏面
    ctx.fillStyle=type==="crumble"?"#e0c79a":"#efe2c4";rr(x-3,y-8,w+6,12,5);ctx.fill();
    // 立面（階鼻下的牆）
    ctx.fillStyle=type==="crumble"?"#b99a6a":"#c9b490";rr(x,y+3,w,h+5,3);ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.5)";ctx.fillRect(x+2,y+4,w-4,2);
    // 草 / 裂縫
    if(type==="crumble"){
      ctx.strokeStyle="#8c6b3a";ctx.lineWidth=1.6;ctx.beginPath();
      for(let i=0;i<3;i++){const cx=x+8+i*(w-16)/2;ctx.moveTo(cx,y-6);ctx.lineTo(cx+5,y+1);ctx.lineTo(cx-2,y+7);}
      ctx.stroke();
    }else{
      ctx.fillStyle="#2eaa57";
      for(let gx=x-1;gx<x+w+2;gx+=11){
        if((gx+Math.round(y))%3===0) continue;
        ctx.beginPath();ctx.moveTo(gx,y-7);ctx.quadraticCurveTo(gx+2,y-14,gx+5,y-8);ctx.closePath();ctx.fill();
      }
      ctx.fillStyle="#78dd73";rr(x-1,y-9,w+2,4,3);ctx.fill();
    }
    ctx.strokeStyle="#7a5a3a";ctx.lineWidth=1.6;ctx.strokeRect(x-2.5,y-8.5,w+5,12+h+1);
  }
  if(type==="conv"){
    // 電扶梯階
    ctx.fillStyle="#42495c";rr(x,y-6,w,h+8,6);ctx.fill();
    ctx.fillStyle="#5d677f";for(let sx=x+3;sx<x+w-4;sx+=10) ctx.fillRect(sx,y-4,5,h+4);
    ctx.fillStyle="#ffd52a";const off=(G.t*70*pl.dir)%14;
    for(let ax=x-14+(pl.dir>0?off:-off);ax<x+w;ax+=14){
      const cx=ax+7,cy=y+h+1;ctx.beginPath();
      if(pl.dir>0){ctx.moveTo(cx-4,cy-4);ctx.lineTo(cx+4,cy);ctx.lineTo(cx-4,cy+4);}
      else{ctx.moveTo(cx+4,cy-4);ctx.lineTo(cx-4,cy);ctx.lineTo(cx+4,cy+4);}
      ctx.fill();
    }
    ctx.strokeStyle="#1c2230";ctx.lineWidth=2;ctx.strokeRect(x-1,y-7,w+2,h+10);
  }
  if(type==="spike"){
    // 黑色尖刺氣球（封面裡的那隻）
    const cx=x+w/2,cy=y+3,bw=w/2-2;
    ctx.fillStyle="#22222a";ctx.beginPath();ctx.ellipse(cx,cy-4,Math.min(bw,20),14,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#3a3a46";ctx.beginPath();ctx.ellipse(cx-5,cy-9,5,3,-.5,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="#4a4a55";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(cx,cy+10);ctx.quadraticCurveTo(cx+4,cy+15,cx,cy+19);ctx.stroke();
    const n=Math.max(3,Math.floor(w/13)),step=w/n;
    for(let i=0;i<n;i++){
      ctx.fillStyle="#fff";ctx.beginPath();ctx.moveTo(x+i*step+1,y+11);ctx.lineTo(x+i*step+step/2,y-3);ctx.lineTo(x+(i+1)*step-1,y+11);ctx.fill();
      ctx.fillStyle="#dc4740";ctx.beginPath();ctx.moveTo(x+i*step+3,y+11);ctx.lineTo(x+i*step+step/2,y+1);ctx.lineTo(x+(i+1)*step-3,y+11);ctx.fill();
    }
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(cx-6,cy-6,3,0,Math.PI*2);ctx.arc(cx+6,cy-6,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#22222a";ctx.beginPath();ctx.arc(cx-5,cy-5.5,1.4,0,Math.PI*2);ctx.arc(cx+7,cy-5.5,1.4,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

function drawPlayer(){
  const p=G.player,C=CH;
  if(G.invuln>0&&Math.floor(G.invuln*12)%2===0) ctx.globalAlpha=.35;
  ctx.save();ctx.translate(p.x+p.w/2,p.y+p.h);ctx.scale(p.face,1);
  const running=G.inputDir!==0&&p.on,step=running?Math.sin(G.animT*16)*3.5:0,playing=G.pitchDir!==0;

  // 鞋與小腿
  ctx.fillStyle="#f8faf5";rr(-11+step,-7,10,6,2);ctx.fill();rr(1-step,-7,10,6,2);ctx.fill();
  ctx.fillStyle="#536272";ctx.fillRect(-11+step,-2,11,2);ctx.fillRect(1-step,-2,11,2);
  ctx.fillStyle=C.skin;ctx.fillRect(-7+step*.35,-14,6,9);ctx.fillRect(2-step*.35,-14,6,9);
  // 短褲
  ctx.fillStyle=C.shorts;ctx.beginPath();ctx.moveTo(-11,-13);ctx.lineTo(11,-13);ctx.lineTo(9,-26);ctx.lineTo(-9,-26);ctx.closePath();ctx.fill();
  ctx.fillStyle=C.shortsDark;ctx.fillRect(-11,-15,22,3);ctx.fillRect(-1,-13,2,10);
  // T恤
  ctx.fillStyle=C.shirt;rr(-11,-38,22,17,5);ctx.fill();
  ctx.fillStyle=C.shirtDark;ctx.fillRect(-11,-24,22,4);
  ctx.fillStyle=C.shirt;rr(-16,-35,7,10,3);ctx.fill();rr(8,-35,7,10,3);ctx.fill();
  ctx.fillStyle=C.collar;ctx.beginPath();ctx.moveTo(-5,-38);ctx.lineTo(5,-38);ctx.lineTo(0,-32);ctx.closePath();ctx.fill();
  // 胸前紅緞帶
  ctx.fillStyle=C.rose;ctx.beginPath();
  for(let i=0;i<10;i++){const a=i/10*Math.PI*2;ctx.lineTo(-4.5+Math.cos(a)*4.2,-31+Math.sin(a)*4.2*(i%2?.55:1));}
  ctx.closePath();ctx.fill();
  ctx.fillStyle=C.roseDark;ctx.beginPath();ctx.arc(-4.5,-31,1.8,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=C.rose;ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(-6,-28);ctx.lineTo(-8,-22);ctx.moveTo(-3,-28);ctx.lineTo(-1,-22);ctx.stroke();
  // 直笛
  ctx.fillStyle=C.skin;ctx.beginPath();ctx.arc(10,-33,3.4,0,Math.PI*2);ctx.arc(17,-36,2.8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#d59a4b";rr(4,-43,21,4.5,2);ctx.fill();
  ctx.fillStyle="#815020";
  for(let i=0;i<4;i++) ctx.beginPath(),ctx.arc(10+i*4,-40.7,.85,0,Math.PI*2),ctx.fill();
  // 頭
  ctx.fillStyle=C.skin;ctx.beginPath();ctx.arc(0,-45,10.6,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=C.hairC;
  if(C.hair==="bob"){
    ctx.beginPath();ctx.arc(0,-47,10.8,Math.PI,Math.PI*2);ctx.fill();
    ctx.fillRect(-11,-47,4.5,10);ctx.fillRect(6.5,-47,4.5,10);
    ctx.fillRect(-10,-52,20,4);
  }else if(C.hair==="short"){
    ctx.beginPath();ctx.arc(0,-47,10.9,Math.PI*1.02,Math.PI*1.98);ctx.fill();
    for(let i=-3;i<=3;i++){ctx.beginPath();ctx.moveTo(i*3-1.5,-53);ctx.lineTo(i*3,-58);ctx.lineTo(i*3+1.5,-53);ctx.closePath();ctx.fill();}
  }else{
    ctx.beginPath();ctx.arc(0,-47,10.9,Math.PI,Math.PI*2);ctx.fill();
    ctx.fillRect(-10,-50,20,3.5);
    ctx.beginPath();ctx.ellipse(-12,-40,4,7,.3,0,Math.PI*2);ctx.ellipse(12,-40,4,7,-.3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=C.rose;ctx.beginPath();ctx.arc(-11,-47,2,0,Math.PI*2);ctx.arc(11,-47,2,0,Math.PI*2);ctx.fill();
  }
  // 臉 / 眼鏡
  if(C.glasses){
    ctx.strokeStyle="#33231c";ctx.lineWidth=1.4;
    ctx.beginPath();ctx.arc(4.6,-45,3.3,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(-3.4,-45,3.3,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(1.3,-45.4);ctx.lineTo(7.9,-45.4);ctx.stroke();
    ctx.beginPath();ctx.moveTo(7.9,-45.6);ctx.lineTo(11,-46.6);ctx.stroke();
    ctx.fillStyle="rgba(255,255,255,.35)";ctx.beginPath();ctx.arc(4.6,-45,2.9,0,Math.PI*2);ctx.fill();
  }
  if(playing){
    ctx.strokeStyle="#33231c";ctx.lineWidth=1.7;ctx.lineCap="round";
    ctx.beginPath();ctx.arc(4.5,-45,2.4,Math.PI*1.1,Math.PI*1.9);ctx.stroke();
    ctx.fillStyle="rgba(242,132,112,.92)";ctx.beginPath();ctx.arc(8,-40,3,0,Math.PI*2);ctx.fill();
  }else{
    if(!C.glasses){ctx.fillStyle="#30231d";ctx.beginPath();ctx.arc(4.5,-45,1.7,0,Math.PI*2);ctx.fill();}
    ctx.fillStyle="rgba(242,132,112,.62)";ctx.beginPath();ctx.arc(.5,-41,2.1,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();ctx.globalAlpha=1;
}

function draw(){
  ctx.clearRect(0,0,W,H);ctx.save();
  if(G.shake>0) ctx.translate((Math.random()-.5)*7*G.shake/.3,(Math.random()-.5)*7*G.shake/.3);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,"#5c94fc");bg.addColorStop(.55,"#4a7fe8");bg.addColorStop(1,"#2d4c9a");
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  for(let i=0;i<5;i++){const y=((i*110+G.bgOff*1.4)%(H+80))-40;drawCloud(50+(i%3)*90,y,1.1+(i%2)*.3);}
  // 樓梯間側牆：磁磚＋扶手
  for(const wx of [0,W-WALL]){
    for(let yy=-24;yy<H+24;yy+=16){
      const y=yy+(G.bgOff%16),row=Math.floor((yy+240)/16);
      ctx.fillStyle=row%2===0?"#d9c39a":"#e8d6b2";ctx.fillRect(wx,y,WALL,15);
      ctx.fillStyle="rgba(255,255,255,.55)";ctx.fillRect(wx+1,y+1,WALL-2,2);
      ctx.fillStyle="#b39a6e";ctx.fillRect(wx,y+14,WALL,2);
    }
    ctx.fillStyle="#ffd52a";ctx.fillRect(wx+WALL/2-2,0,4,H);
    ctx.fillStyle="rgba(120,55,26,.45)";ctx.fillRect(wx+WALL/2-2,0,1,H);
    for(let yy=0;yy<H;yy+=42){ctx.fillStyle="#bb672d";ctx.fillRect(wx+WALL/2-4,yy+(G.bgOff%42),8,4);}
  }
  ctx.fillStyle="#3b74d9";ctx.fillRect(0,0,W,16);
  ctx.fillStyle="#f4d29c";ctx.fillRect(0,14,W,4);
  ctx.fillStyle="#fff";
  for(let x=4;x<W;x+=22){ctx.beginPath();ctx.moveTo(x,18);ctx.lineTo(x+11,CEIL+2);ctx.lineTo(x+22,18);ctx.fill();}
  for(const pl of G.plats) drawPlat(pl);
  for(const q of G.parts){
    ctx.globalAlpha=Math.max(0,q.life*2);
    if(q.note){ctx.font="800 15px Fredoka,sans-serif";ctx.textAlign="center";ctx.fillStyle=q.color;ctx.fillText(q.glyph,q.x,q.y);}
    else{ctx.fillStyle=q.color;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.fill();}
  }
  ctx.globalAlpha=1;
  drawPlayer();
  ctx.textAlign="center";
  for(const f of G.floats){
    ctx.globalAlpha=Math.min(1,f.life);
    ctx.font=f.big?"900 26px Fredoka,'Noto Sans TC',sans-serif":"800 16px Fredoka,sans-serif";
    ctx.lineWidth=6;ctx.strokeStyle="#78371a";ctx.strokeText(f.text,f.x,f.y);
    ctx.fillStyle="#ffd52a";ctx.fillText(f.text,f.x,f.y);
  }
  ctx.globalAlpha=1;
  if(G.redFlash>0){
    const alpha=Math.min(.4,G.redFlash),rg=ctx.createRadialGradient(W/2,H/2,H/4,W/2,H/2,H);
    rg.addColorStop(0,"rgba(220,71,64,0)");rg.addColorStop(1,`rgba(220,71,64,${alpha})`);
    ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
  }
  ctx.restore();
  if(G.state!=="calib") drawHUD();
  if(G.state==="count"){
    ctx.fillStyle="rgba(20,40,90,.45)";ctx.fillRect(0,0,W,H);
    const n=Math.ceil(G.countT),label=n>0?String(n):"GO!";
    ctx.textAlign="center";ctx.font="900 72px Fredoka,sans-serif";ctx.lineWidth=8;ctx.strokeStyle="#78371a";
    ctx.strokeText(label,W/2,H/2);ctx.fillStyle="#ffd52a";ctx.fillText(label,W/2,H/2);
    ctx.font="700 16px Fredoka,'Noto Sans TC',sans-serif";ctx.fillStyle="#fff";
    ctx.fillText(`${CH.zh}準備下樓！${micOn?"拿起直笛，準備吹奏！":"用 ← → 移動！"}`,W/2,H/2+42);
  }
  if(G.state==="pause"){
    ctx.fillStyle="rgba(20,40,90,.55)";ctx.fillRect(0,0,W,H);
    ctx.textAlign="center";ctx.font="900 34px Fredoka,sans-serif";ctx.lineWidth=6;ctx.strokeStyle="#78371a";
    ctx.strokeText("PAUSED",W/2,H/2-6);ctx.fillStyle="#fff";ctx.fillText("PAUSED",W/2,H/2-6);
    ctx.font="700 15px Fredoka,'Noto Sans TC',sans-serif";ctx.fillStyle="#ffd52a";
    ctx.fillText("按 P 或 ESC 繼續",W/2,H/2+24);
  }
}

/* ---------- 主迴圈 ---------- */
let lastT=performance.now(),smoothMidi=null;
function loop(now){
  let dt=(now-lastT)/1000;lastT=now;dt=Math.min(dt,.05);
  const {freq,rms}=readPitch(cfg.sens||1.0);
  let midi=null;
  if(freq>0){
    midi=freqToMidi(freq);
    if(smoothMidi!=null&&Math.abs(midi-smoothMidi)<1.5) midi=smoothMidi+(midi-smoothMidi)*.45;
    smoothMidi=midi;
  }else if(G.state!=="play") smoothMidi=null;
  G.dispMidi=midi;
  G.pitchDir=(micOn&&micWanted&&cfg.leftMidi!=null&&cfg.rightMidi!=null)?decidePitch(midi,dt):0;
  if(!calib.classList.contains("hidden")) updateCalibUI(midi,rms);
  if(G.state==="count"){
    G.countT-=dt;const n=Math.ceil(G.countT);
    if(n!==G.countStep&&n>0){G.countStep=n;sfx.count(440+n*110);}
    if(G.countT<=0){G.state="play";sfx.count(980);}
  }
  if(G.state==="play") update(dt);
  else if(G.state==="calib"||G.state==="menu"){G.bgOff=(G.bgOff+12*dt)%48;}
  draw();requestAnimationFrame(loop);
}

/* ---------- 校準 UI ---------- */
let recording=null;
function updateCalibUI(midi,rms){
  volBar.style.width=Math.min(100,rms*900)+"%";
  if(midi!=null){
    bigNote.textContent=midiName(midi);bigFreq.textContent=midiToFreq(midi).toFixed(1)+" Hz";
    const cents=(midi-Math.round(midi))*100;
    needle.style.left=(50+Math.max(-49,Math.min(49,cents)))+"%";
  }else{
    if(!recording){bigNote.textContent="♪";bigFreq.textContent="吹一個音試試看";}
    needle.style.left="50%";
  }
  if(recording){recording.t+=1/60;if(midi!=null)recording.samples.push(midi);if(recording.t>=1.5)finishRecording();}
}
function startRecording(side){
  if(!micOn){toast("請先允許麥克風");return;}
  recording={side,samples:[],t:0};$("calibMsg").innerHTML=`<span class="dim">請穩定吹奏 1.5 秒⋯</span>`;
}
function finishRecording(){
  const rec=recording;recording=null;const s=rec.samples,msg=$("calibMsg");
  if(s.length<10){msg.innerHTML=`<span class="err">沒有偵測到穩定的聲音，請再試一次</span>`;return;}
  const mean=s.reduce((a,b)=>a+b,0)/s.length,maxDev=Math.max(...s.map(v=>Math.abs(v-mean)))*100;
  if(maxDev>60){msg.innerHTML=`<span class="err">音高飄移太大（${maxDev|0}¢），請把氣息吹穩</span>`;return;}
  const other=rec.side==="L"?cfg.rightMidi:cfg.leftMidi;
  if(other!=null&&Math.abs(mean-other)<3){msg.innerHTML=`<span class="err">兩個音太接近，請相隔至少 3 個半音</span>`;return;}
  if(rec.side==="L") cfg.leftMidi=mean; else cfg.rightMidi=mean;
  saveCfg();sfx.set();refreshSlots();
  msg.innerHTML=`<span class="ok">✔ 已設定為 ${midiName(mean)}</span>`;
}
function refreshSlots(){
  const okL=cfg.leftMidi!=null,okR=cfg.rightMidi!=null;
  $("nmL").textContent=okL?midiName(cfg.leftMidi):"尚未設定";
  $("nmR").textContent=okR?midiName(cfg.rightMidi):"尚未設定";
  $("slotL").classList.toggle("set",okL);$("slotR").classList.toggle("set",okR);
  $("btnGo").disabled=false;
  if(typeof refreshPianoHighlight==="function") refreshPianoHighlight();
}
$("recL").addEventListener("click",()=>startRecording("L"));
$("recR").addEventListener("click",()=>startRecording("R"));
$("btnPreset").addEventListener("click",()=>{
  cfg.leftMidi=78;cfg.rightMidi=85;saveCfg();refreshSlots();sfx.set();
  $("calibMsg").innerHTML=`<span class="ok">✔ 已套用直笛預設：升Fa＝左、升Do＝右</span>`;
});

const PIANO_LO=60,PIANO_HI=86;let manualTarget="L";
const manualPanel=$("manualPanel"),btnManualToggle=$("btnManualToggle"),tgtL=$("tgtL"),tgtR=$("tgtR"),pianoWrap=$("pianoWrap"),pianoKeyEls={};
function buildPiano(){
  const WHITE_W=30,WHITE_H=108,BLACK_W=18,BLACK_H=66,whiteSet=new Set([0,2,4,5,7,9,11]),whites=[];
  for(let m=PIANO_LO;m<=PIANO_HI;m++) if(whiteSet.has(((m%12)+12)%12)) whites.push(m);
  const ns="http://www.w3.org/2000/svg",svg=document.createElementNS(ns,"svg"),totalW=whites.length*WHITE_W;
  svg.setAttribute("viewBox",`0 0 ${totalW} ${WHITE_H}`);svg.setAttribute("width",totalW);svg.setAttribute("height",WHITE_H);
  whites.forEach((m,i)=>{
    const key=document.createElementNS(ns,"rect");
    key.setAttribute("x",i*WHITE_W+1);key.setAttribute("y",0);key.setAttribute("width",WHITE_W-2);
    key.setAttribute("height",WHITE_H);key.setAttribute("rx",3);key.setAttribute("fill","#fff8e8");key.setAttribute("stroke","#78371a");
    key.style.cursor="pointer";key.addEventListener("click",()=>pickManualNote(m));
    svg.appendChild(key);pianoKeyEls[m]={el:key,isBlack:false};
    if(NOTE_NAMES[m%12]==="C"){
      const label=document.createElementNS(ns,"text");
      label.setAttribute("x",i*WHITE_W+WHITE_W/2);label.setAttribute("y",WHITE_H-8);label.setAttribute("text-anchor","middle");
      label.setAttribute("font-size","9");label.setAttribute("fill","#78371a");label.textContent=midiNameShort(m);
      svg.appendChild(label);
    }
  });
  for(let m=PIANO_LO;m<=PIANO_HI;m++){
    const n=((m%12)+12)%12;if(![1,3,6,8,10].includes(n)) continue;
    let leftIndex=-1;
    for(let i=0;i<whites.length;i++){if(whites[i]<m) leftIndex=i;else break;}
    if(leftIndex<0) continue;
    const key=document.createElementNS(ns,"rect");
    key.setAttribute("x",(leftIndex+1)*WHITE_W-BLACK_W/2);key.setAttribute("y",0);key.setAttribute("width",BLACK_W);
    key.setAttribute("height",BLACK_H);key.setAttribute("rx",2);key.setAttribute("fill","#382718");key.setAttribute("stroke","#1b120c");
    key.style.cursor="pointer";key.addEventListener("click",e=>{e.stopPropagation();pickManualNote(m);});
    svg.appendChild(key);pianoKeyEls[m]={el:key,isBlack:true};
  }
  pianoWrap.innerHTML="";pianoWrap.appendChild(svg);
}
function pickManualNote(midi){
  const other=manualTarget==="L"?cfg.rightMidi:cfg.leftMidi,msg=$("calibMsg");
  if(other!=null&&Math.abs(midi-other)<3){msg.innerHTML=`<span class="err">兩個音太接近，請相隔至少 3 個半音</span>`;return;}
  if(manualTarget==="L") cfg.leftMidi=midi; else cfg.rightMidi=midi;
  saveCfg();sfx.set();beep(midiToFreq(midi),.35,"square",.06);refreshSlots();
  msg.innerHTML=`<span class="ok">✔ ${manualTarget==="L"?"往左":"往右"}已設定為 ${midiName(midi)}</span>`;
}
function refreshPianoHighlight(){
  for(const m in pianoKeyEls){
    const midi=+m,{el,isBlack}=pianoKeyEls[m];
    let fill=isBlack?"#382718":"#fff8e8";
    if(cfg.leftMidi!=null&&Math.round(cfg.leftMidi)===midi) fill="#ffd52a";
    if(cfg.rightMidi!=null&&Math.round(cfg.rightMidi)===midi) fill="#2eaa57";
    el.setAttribute("fill",fill);
  }
}
function setManualTarget(side){manualTarget=side;tgtL.classList.toggle("active",side==="L");tgtR.classList.toggle("active",side==="R");}
btnManualToggle.addEventListener("click",()=>{
  const willShow=manualPanel.classList.contains("hidden");
  manualPanel.classList.toggle("hidden",!willShow);
  btnManualToggle.textContent=willShow?"🎹 收起手動選音":"🎹 手動選音（不吹也可以）";
  if(willShow){if(!pianoWrap.querySelector("svg")) buildPiano();refreshPianoHighlight();}
});
tgtL.addEventListener("click",()=>setManualTarget("L"));
tgtR.addEventListener("click",()=>setManualTarget("R"));

const sensEl=$("sens"),sensValEl=$("sensVal");
sensEl.value=cfg.sens||1.0;sensValEl.textContent=(+cfg.sens||1).toFixed(1)+"×";
sensEl.addEventListener("input",()=>{cfg.sens=+sensEl.value;sensValEl.textContent=cfg.sens.toFixed(1)+"×";saveCfg();});

/* ---------- 流程 ---------- */
function startGame(){
  hide(over);hide(calib);
  resetWorld();
  G.state="count";G.countT=3.2;G.countStep=4;
}
function openCalib(){
  G.state="calib";hide(over);show(calib);refreshSlots();startMic();
}
$("btnGo").addEventListener("click",async()=>{
  if(cfg.leftMidi!=null&&cfg.rightMidi!=null){micWanted=true;await startMic();}
  startGame();
});
$("btnBack").addEventListener("click",()=>{location.href="index.html";});
$("btnRetry").addEventListener("click",startGame);
$("btnReCalib").addEventListener("click",openCalib);
btnMute.addEventListener("click",()=>{
  muted=!muted;store.set(K_MUTE,muted?"1":"0");
  btnMute.textContent=muted?"🔇":"🔊";
  if(!muted) sfx.set();
});
btnMute.textContent=muted?"🔇":"🔊";
btnMic.addEventListener("click",async()=>{
  if(cfg.leftMidi==null||cfg.rightMidi==null){toast("請先設定左右兩個音（可按右上角 ⚙／設定頁）");openCalib();return;}
  if(micWanted){micWanted=false;btnMic.classList.remove("on");btnMic.textContent="🎤 聲控：關";PD.dir=0;return;}
  micWanted=true;
  if(await startMic()){btnMic.classList.add("on");toast("聲控已開啟：吹左音往左、吹右音往右");}
  else micWanted=false;
});
// 觸控按鈕
(function(){
  function mk(side){
    const b=document.createElement("div");
    b.style.cssText=`position:absolute;bottom:54px;${side==="L"?"left:14px":"right:14px"};width:64px;height:64px;border-radius:50%;
      background:#2eaa57;border:3px solid #fff;color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;
      z-index:5;user-select:none;touch-action:none;box-shadow:0 5px 0 #176d36;font-family:Fredoka,sans-serif;font-weight:800`;
    b.textContent=side==="L"?"◄":"►";
    const v=side==="L"?-1:1;
    const dn=e=>{e.preventDefault();G.touchDir=v;b.style.background="#ffd52a";b.style.color="#3b3010";};
    const up=e=>{e.preventDefault();if(G.touchDir===v) G.touchDir=0;b.style.background="#2eaa57";b.style.color="#fff";};
    b.addEventListener("pointerdown",dn);b.addEventListener("pointerup",up);
    b.addEventListener("pointercancel",up);b.addEventListener("pointerleave",up);
    $("wrap").appendChild(b);
  }
  mk("L");mk("R");
})();

document.title=`阿順下樓梯 — ${CH.zh}`;
resetWorld();G.state="count";G.countT=3.2;G.countStep=4;
if(qs.get("mode")==="calib") openCalib();
requestAnimationFrame(loop);
</script>
